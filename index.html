    <style>
/* ============================================
   Java Notes — 桌面 + 移动端样式
   ============================================ */

/* ---- 变量 ---- */
:root {
    --primary: #4A6CF7;
    --primary-light: #EEF1FE;
    --text: #1e293b;
    --text-muted: #94a3b8;
    --bg: #f1f5f9;
    --card-bg: #fff;
    --border: #e2e8f0;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --shadow-hover: 0 4px 12px rgba(0,0,0,.06);
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --mark-color: #f59e0b;
    --radius: 10px;
    --transition: .2s cubic-bezier(.4,0,.2,1);
}

/* ---- Reset ---- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.7; color: var(--text); background: var(--bg);
    display: flex; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

/* ---- 侧边栏 ---- */
.sidebar {
    width: 272px; height: 100vh; position: fixed; top: 0; left: 0;
    background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 100; overflow: hidden;
    transition: width var(--transition);
}
.sidebar.collapsed { width: 56px; }

.sidebar-header {
    padding: 18px 16px 14px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between;
}
.sidebar-header h2 { font-size: 16px; color: #0f172a; font-weight: 700; letter-spacing: -.2px; }
.sidebar-header .sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.sidebar-toggle {
    width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); transition: all var(--transition); flex-shrink: 0; margin-left: 6px;
}
.sidebar-toggle:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

/* 收缩状态 */
.sidebar.collapsed .sidebar-header { padding: 14px 12px; justify-content: center; }
.sidebar.collapsed .header-text,
.sidebar.collapsed .sub,
.sidebar.collapsed .search-wrap,
.sidebar.collapsed .category-wrap,
.sidebar.collapsed .toc-wrap .label,
.sidebar.collapsed .toc-item .q-text,
.sidebar.collapsed .toc-item .cat-dot,
.sidebar.collapsed .sidebar-footer { display: none; }
.sidebar.collapsed .sidebar-toggle { margin-left: 0; }
.sidebar.collapsed .toc-item { padding: 10px 12px; text-align: center; border-left: none; }
.sidebar.collapsed .toc-item .cat-dot { display: inline-block; width: 8px; height: 8px; margin: 0; }
.sidebar.collapsed .toc-wrap { padding: 4px 0; }

/* 搜索 */
.search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
.search-wrap input {
    width: 100%; padding: 8px 10px 8px 32px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; outline: none; transition: border-color var(--transition), box-shadow var(--transition);
    background: #f8fafc;
}
.search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,108,247,.1); background: #fff; }
.search-wrap::before { content: "🔍"; position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: .6; }

/* 分类 */
.category-wrap { padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.category-wrap .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.categories { display: flex; flex-wrap: wrap; gap: 4px; }
.cat-btn {
    padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 16px;
    cursor: pointer; background: #fff; color: var(--text-muted); transition: all var(--transition);
    white-space: nowrap; font-weight: 500;
}
.cat-btn:hover { border-color: var(--primary); color: var(--primary); background: #fff; }
.cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

/* 目录 */
.toc-wrap { flex: 1; overflow-y: auto; padding: 6px 0; }
.toc-wrap .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); padding: 6px 16px 4px; font-weight: 600; }
.toc-list { list-style: none; }
.toc-item {
    display: block; width: 100%; text-align: left; padding: 7px 16px; font-size: 12px;
    color: var(--text); cursor: pointer; border: none; background: transparent;
    border-left: 3px solid transparent; transition: all .12s; line-height: 1.4;
}
.toc-item:hover { background: var(--primary-light); color: var(--primary); }
.toc-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.toc-item .cat-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 7px; vertical-align: middle; flex-shrink: 0; }
.toc-item .q-text { display: inline; }
.toc-item .marked-star { color: var(--mark-color); font-size: 11px; margin-left: 3px; }

/* 侧边栏底部 */
.sidebar-footer { padding: 9px 10px 10px; border-top: 1px solid var(--border); flex-shrink: 0; background: #fff; }
.sidebar-primary-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.sidebar-tool-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 5px; }
.sidebar-footer .quick-btn {
    min-width: 0; padding: 7px 4px; overflow: hidden; font-size: 10px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; background: #fff; color: var(--text-muted); transition: all var(--transition);
    text-align: center; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
}
.sidebar-primary-actions .quick-btn { display: grid; gap: 2px; place-items: center; min-height: 46px; padding: 6px 3px; background: #f8fafc; }
.sidebar-primary-actions .quick-btn .quick-icon { font-size: 15px; line-height: 1; }
.sidebar-tool-actions .quick-btn { border-color: transparent; background: transparent; font-size: 9px; }
.sidebar-footer .sync-entry { display: flex; width: 100%; align-items: center; justify-content: center; gap: 6px; margin-top: 5px; padding: 6px; background: #f8fafc; }
.sidebar-footer .quick-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.sidebar-footer .quick-btn.active-filter { background: var(--primary-light); color: var(--primary); border-color: var(--primary); font-weight: 600; }
.sidebar-footer .quick-btn .badge {
    display: inline-block; background: var(--danger); color: #fff; font-size: 10px;
    padding: 1px 6px; border-radius: 10px; margin-left: 3px; font-weight: 600;
}

/* ---- 主内容 ---- */
.main {
    margin-left: 272px; flex: 1; min-width: 0; padding: 40px 48px 60px;
    max-width: none; width: calc(100% - 272px);
    transition: margin-left var(--transition), width var(--transition);
}
.main.shifted { margin-left: 56px; width: calc(100% - 56px); }
.main > .main-header,
.main > #notesContainer { width: 100%; max-width: 1200px; margin-inline: auto; }

.main-header { margin-bottom: 28px; }
.main-header h1 { font-size: 26px; color: #0f172a; font-weight: 800; letter-spacing: -.5px; margin-bottom: 2px; }
.main-header .subtitle { color: var(--text-muted); font-size: 14px; }
.main-header .stats { margin-top: 8px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.main-header .stats span { font-weight: 700; color: var(--primary); }

.toggle-all-btn {
    display: inline-flex; align-items: center; gap: 3px; padding: 5px 14px;
    font-size: 11px; border: 1px solid var(--border); border-radius: 16px;
    background: #fff; color: var(--text-muted); cursor: pointer; transition: all var(--transition);
    font-weight: 500;
}
.toggle-all-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

/* 分区标题 */
.cat-section-title {
    font-size: 13px; font-weight: 700; color: var(--primary); margin: 32px 0 10px;
    padding-bottom: 7px; border-bottom: 2px solid var(--primary-light); letter-spacing: .3px;
}
.cat-section-title:first-child { margin-top: 0; }

/* 笔记卡片 */
.note {
    background: var(--card-bg); border-radius: var(--radius); padding: 20px 24px;
    margin-bottom: 12px; border: 1px solid var(--border);
    transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
    scroll-margin-top: 24px; position: relative;
}
.note:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.note.highlight { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,108,247,.1); }
.note.marked { border-left: 3px solid var(--mark-color); background: #fffef5; }
.note.sunk { opacity: .6; border-left: 3px solid #cbd5e0; background: #fafafa; }
.note.sunk:hover { opacity: .8; }

.note .question {
    font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px;
    padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;
    display: flex; align-items: flex-start; gap: 8px; cursor: pointer; user-select: none;
}
.note .question::before {
    content: "Q"; display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; background: var(--primary); color: #fff;
    font-size: 12px; font-weight: 700; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
}
.note .question .expand-icon { margin-left: auto; font-size: 11px; color: var(--text-muted); transition: transform var(--transition); line-height: 22px; opacity: .5; }
.note .question .expand-icon.open { transform: rotate(90deg); opacity: 1; }

.note .answer { font-size: 14px; color: #475569; white-space: pre-wrap; padding-left: 30px; display: block; line-height: 1.8; }
.note .answer.collapsed { display: none; }

.note .meta-row { display: flex; gap: 6px; margin-top: 12px; padding-left: 30px; flex-wrap: wrap; align-items: center; }
.note .category-tag {
    display: inline-block; padding: 3px 10px; font-size: 11px; border-radius: 12px;
    background: var(--primary-light); color: var(--primary); font-weight: 600;
}

/* 操作按钮 */
.note-actions { margin-left: auto; display: flex; gap: 3px; }
.action-btn {
    width: 30px; height: 30px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; cursor: pointer; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all var(--transition); color: var(--text-muted);
}
.action-btn:hover { background: #f8fafc; border-color: var(--border); }
.action-btn.mark-btn.marked { color: var(--mark-color); }
.action-btn.mark-btn:hover { color: var(--mark-color); border-color: var(--mark-color); background: #fffbeb; }
.action-btn.sink-btn.sunk { color: var(--text-muted); }
.action-btn.sink-btn:hover { color: #64748b; border-color: #cbd5e0; }
.action-btn.delete-btn:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-light); }

/* 回收站 */
.trash-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--danger-light); border: 1px solid #fecaca;
    border-radius: var(--radius); margin-bottom: 16px;
}
.trash-header .trash-title { font-size: 14px; font-weight: 600; color: var(--danger); }
.trash-header .empty-trash-btn {
    padding: 5px 14px; font-size: 12px; border: 1px solid var(--danger); border-radius: 8px;
    background: #fff; color: var(--danger); cursor: pointer; transition: all var(--transition); font-weight: 500;
}
.trash-header .empty-trash-btn:hover { background: var(--danger); color: #fff; }
.trash-actions { display: flex; gap: 8px; margin-left: auto; }
.restore-btn, .perm-delete-btn {
    padding: 4px 14px; font-size: 11px; border-radius: 8px; cursor: pointer; transition: all var(--transition); border: 1px solid; font-weight: 500;
}
.restore-btn { background: #fff; color: var(--primary); border-color: var(--primary); }
.restore-btn:hover { background: var(--primary); color: #fff; }
.perm-delete-btn { background: #fff; color: var(--danger); border-color: var(--danger); }
.perm-delete-btn:hover { background: var(--danger); color: #fff; }

/* ---- Quiz ---- */
.quiz-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 16px 20px; background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: var(--radius); margin-bottom: 16px; color: #fff;
}
.quiz-banner .quiz-title { font-size: 15px; font-weight: 700; }
.quiz-banner .quiz-sub { font-size: 12px; opacity: .85; }
.quiz-banner .reshuffle-btn {
    padding: 7px 16px; font-size: 13px; border: 1px solid rgba(255,255,255,.3); border-radius: 8px;
    background: rgba(255,255,255,.12); color: #fff; cursor: pointer; transition: all var(--transition); font-weight: 500;
}
.quiz-banner .reshuffle-btn:hover { background: rgba(255,255,255,.22); }
.quiz-card { background: #fff; border-radius: var(--radius); padding: 18px 22px; margin-bottom: 12px; border: 1px solid var(--border); }
.quiz-card .quiz-q { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: flex-start; gap: 8px; }
.quiz-card .quiz-q::before {
    content: "Q"; display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; background: #667eea; color: #fff;
    font-size: 12px; font-weight: 700; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
}
.quiz-card .quiz-cat { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; padding-left: 30px; }
.quiz-card .quiz-answer {
    display: none; white-space: pre-wrap; font-size: 14px; color: #475569;
    padding: 14px 16px; margin-top: 8px; background: #f8fafc; border-radius: 8px;
    border-left: 3px solid #667eea; line-height: 1.8;
}
.quiz-card .quiz-answer.revealed { display: block; }
.quiz-card .quiz-actions { padding-left: 30px; margin-top: 6px; }
.quiz-card .reveal-btn {
    padding: 5px 16px; font-size: 12px; border: 1px solid #667eea; border-radius: 8px;
    background: #fff; color: #667eea; cursor: pointer; transition: all var(--transition); font-weight: 500;
}
.quiz-card .reveal-btn:hover { background: #667eea; color: #fff; }
.quiz-card .reveal-btn.shown { background: #f1f5f9; color: var(--text-muted); border-color: var(--border); }
.mastery-actions { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.mastery-actions.revealed { display: grid; }
.mastery-actions button { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: #64748b; font-size: 12px; font-weight: 600; cursor: pointer; }
.mastery-actions .hard:hover, .mastery-actions .hard.selected { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
.mastery-actions .fuzzy:hover, .mastery-actions .fuzzy.selected { color: #d97706; border-color: #fde68a; background: #fffbeb; }
.mastery-actions .known:hover, .mastery-actions .known.selected { color: #059669; border-color: #a7f3d0; background: #ecfdf5; }

/* ---- 资源卡片 ---- */
.resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.resource-card {
    display: flex; flex-direction: column; padding: 18px 20px; background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius); text-decoration: none;
    color: inherit; transition: all var(--transition);
}
.resource-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
.resource-card .res-icon { font-size: 26px; margin-bottom: 8px; }
.resource-card .res-name { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
.resource-card .res-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; flex: 1; }
.resource-card .res-domain { font-size: 10px; color: var(--primary); font-weight: 600; }
.resource-card .res-tag { display: inline-block; padding: 2px 8px; font-size: 10px; border-radius: 6px; background: #f1f5f9; color: var(--text-muted); font-weight: 500; }

/* ---- 简历准备中心 ---- */
.resume-prep { color: #25324a; }
.resume-tabs {
    display: flex; gap: 6px; padding: 6px; margin-bottom: 20px; overflow-x: auto;
    background: rgba(255,255,255,.82); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); scrollbar-width: none;
}
.resume-tabs::-webkit-scrollbar, .resume-filters::-webkit-scrollbar { display: none; }
.resume-tab {
    flex: 1 0 auto; min-width: 104px; padding: 9px 12px; border: 0; border-radius: 10px;
    background: transparent; color: #64748b; font: 600 12px/1.2 inherit; cursor: pointer;
    transition: all var(--transition);
}
.resume-tab span { margin-right: 5px; }
.resume-tab:hover { color: var(--primary); background: var(--primary-light); }
.resume-tab.active { color: #fff; background: #263b80; box-shadow: 0 4px 12px rgba(38,59,128,.2); }

.resume-hero {
    display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 28px; align-items: center;
    padding: 34px 36px; border-radius: 18px; color: #fff;
    background: radial-gradient(circle at 85% 12%, rgba(128,151,255,.5), transparent 28%), linear-gradient(135deg, #172554 0%, #283c7c 58%, #4a6cf7 130%);
    box-shadow: 0 14px 34px rgba(30,41,100,.16);
}
.resume-eyebrow, .resume-section-heading > div > span, .resume-mock-banner > div > span,
.resume-check-head > div > span, .resume-library-head > span {
    display: block; margin-bottom: 7px; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: 1.7px;
}
.resume-eyebrow, .resume-mock-banner > div > span { color: #bdc9ff; }
.resume-hero h2 { max-width: 680px; font-size: clamp(23px, 2.4vw, 34px); line-height: 1.25; letter-spacing: -.7px; }
.resume-hero-copy > p { max-width: 720px; margin-top: 10px; color: #dbe4ff; font-size: 13px; line-height: 1.75; }
.resume-hero-actions { display: flex; gap: 9px; margin-top: 20px; flex-wrap: wrap; }
.resume-primary-btn, .resume-ghost-btn {
    padding: 10px 17px; border-radius: 9px; font: 700 12px/1.2 inherit; cursor: pointer; transition: all var(--transition);
}
.resume-primary-btn { border: 1px solid #fff; color: #23366f; background: #fff; }
.resume-ghost-btn { border: 1px solid rgba(255,255,255,.35); color: #fff; background: rgba(255,255,255,.08); }
.resume-primary-btn:hover, .resume-ghost-btn:hover { transform: translateY(-1px); }
.resume-score { text-align: center; }
.resume-score strong { display: block; font-size: 44px; line-height: 1; letter-spacing: -2px; }
.resume-score > span { display: block; margin-top: 7px; color: #dbe4ff; font-size: 11px; }
.resume-score > div { height: 6px; margin-top: 12px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.16); }
.resume-score i { display: block; height: 100%; border-radius: inherit; background: #fff; }

.resume-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin: 14px 0 28px; }
.resume-stat-grid article { display: grid; grid-template-columns: 34px 1fr; padding: 15px 17px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
.resume-stat-grid article > span { grid-row: 1 / 3; align-self: center; font-size: 20px; }
.resume-stat-grid strong { color: #172554; font-size: 18px; line-height: 1.15; }
.resume-stat-grid small { color: #94a3b8; font-size: 10px; }

.resume-section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 26px 0 12px; }
.resume-section-heading h2, .resume-check-head h2, .resume-library-head h2, .resume-mock-banner h2 { color: #172554; font-size: 20px; line-height: 1.3; }
.resume-section-heading button { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--primary); font: 700 11px inherit; cursor: pointer; }
.resume-section-heading > small { max-width: 420px; color: #94a3b8; font-size: 11px; text-align: right; }

.resume-source-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.resume-source-card { padding: 18px; background: #fff; border: 1px solid var(--border); border-radius: 14px; transition: all var(--transition); }
.resume-source-card:hover { transform: translateY(-2px); border-color: #b8c5ff; box-shadow: var(--shadow-hover); }
.resume-source-head, .resume-source-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.resume-source-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 11px; background: var(--primary-light); font-size: 20px; }
.resume-file-badge, .resume-source-chip, .resume-duration { padding: 3px 8px; border-radius: 99px; background: #eef2ff; color: #4a60bd; font-size: 9px; font-style: normal; font-weight: 700; }
.resume-source-card h3 { margin-top: 14px; color: #172554; font-size: 15px; }
.resume-source-role { min-height: 38px; margin: 4px 0 7px; color: #516078 !important; font-weight: 600; }
.resume-source-card > p { color: #8a97aa; font-size: 11px; line-height: 1.6; }
.resume-mini-progress { height: 4px; margin: 14px 0 8px; overflow: hidden; background: #edf1f7; border-radius: 99px; }
.resume-mini-progress span { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.resume-source-foot { color: #94a3b8; font-size: 9px; }
.resume-source-foot button { border: 0; background: none; color: var(--primary); font: 700 10px inherit; cursor: pointer; }

.resume-route { margin-top: 30px; }
.resume-route ol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; list-style: none; }
.resume-route li { display: flex; gap: 11px; padding: 15px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
.resume-route li > b { color: #a8b6f5; font-size: 18px; line-height: 1; }
.resume-route li strong, .resume-route li span { display: block; }
.resume-route li strong { color: #25324a; font-size: 12px; }
.resume-route li span { margin-top: 4px; color: #94a3b8; font-size: 10px; line-height: 1.55; }

.resume-filters { display: flex; gap: 7px; margin: 2px 0 18px; overflow-x: auto; scrollbar-width: none; }
.resume-filter { flex: 0 0 auto; padding: 7px 13px; border: 1px solid var(--border); border-radius: 99px; background: #fff; color: #718096; font: 600 11px inherit; cursor: pointer; }
.resume-filter.active { color: #fff; border-color: #263b80; background: #263b80; }

.resume-pitch-list, .resume-story-list, .resume-question-list { display: grid; gap: 12px; }
.resume-pitch-card, .resume-story-card, .resume-qa-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; }
.resume-pitch-card { padding: 21px 23px; }
.resume-pitch-card header { display: flex; justify-content: space-between; gap: 10px; }
.resume-pitch-card header > div { display: flex; gap: 6px; }
.resume-pitch-card header button { border: 0; background: none; color: var(--primary); font: 700 10px inherit; cursor: pointer; }
.resume-pitch-card h3 { margin: 13px 0 7px; color: #172554; font-size: 15px; }
.resume-pitch-card p { color: #506078; font-size: 13px; line-height: 1.85; }
.resume-empty { padding: 40px; text-align: center; color: #94a3b8; }

.resume-story-card { padding: 22px; }
.resume-story-card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
.resume-story-card > header h3 { display: inline; margin-left: 8px; color: #172554; font-size: 16px; }
.resume-story-card > header > div:last-child { display: flex; justify-content: flex-end; gap: 5px; flex-wrap: wrap; }
.resume-story-card > header > div:last-child span { padding: 3px 8px; border-radius: 6px; background: #f1f5f9; color: #64748b; font-size: 9px; }
.resume-story-card dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.resume-story-card dl > div { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 12px; background: #f8fafc; border-radius: 10px; }
.resume-story-card dt { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: #e8edff; color: #4058b7; font: 800 12px inherit; }
.resume-story-card dd { color: #66758c; font-size: 11px; line-height: 1.65; }
.resume-story-card dd strong { display: block; margin-bottom: 2px; color: #25324a; font-size: 11px; }
.resume-boundary { margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #fff8e8; color: #8b6a18; font-size: 10px; line-height: 1.6; }
.resume-boundary b, .resume-followup b { margin-right: 7px; }

.resume-mock-banner { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 24px; margin-bottom: 16px; border-radius: 14px; background: #172554; color: #fff; }
.resume-mock-banner h2 { color: #fff; }
.resume-mock-banner p { margin-top: 4px; color: #cbd5ff; font-size: 11px; }
.resume-mock-banner > button { flex: 0 0 auto; padding: 10px 15px; border: 1px solid rgba(255,255,255,.28); border-radius: 9px; background: #fff; color: #243873; font: 700 11px inherit; cursor: pointer; }
.resume-question-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.resume-question-tools label { flex: 1; max-width: 520px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 9px; background: #fff; font-size: 11px; }
.resume-question-tools input { width: calc(100% - 24px); border: 0; outline: 0; color: #475569; font: 12px inherit; }
.resume-question-tools > span { color: #94a3b8; font-size: 10px; }
.resume-qa-card { overflow: hidden; transition: border-color var(--transition), box-shadow var(--transition); }
.resume-qa-card.mock-focus { border-color: #7c91ed; box-shadow: 0 0 0 3px rgba(74,108,247,.12); }
.resume-question { display: flex; width: 100%; align-items: center; gap: 11px; padding: 16px 18px; border: 0; background: #fff; color: #25324a; text-align: left; cursor: pointer; }
.resume-q-mark { display: grid; flex: 0 0 auto; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: var(--primary); color: #fff; font: 800 12px inherit; }
.resume-question > span:nth-child(2) { flex: 1; font-size: 13px; font-weight: 700; }
.resume-question small { display: block; margin-bottom: 2px; color: #8190a6; font-size: 9px; }
.resume-question i { color: #94a3b8; font-size: 9px; font-style: normal; }
.resume-answer { display: none; padding: 0 18px 18px 57px; }
.resume-qa-card.revealed .resume-answer { display: block; }
.resume-answer > p { padding-top: 14px; border-top: 1px solid #edf1f5; color: #54647a; font-size: 12px; line-height: 1.8; }
.resume-followup { margin-top: 10px; padding: 9px 11px; border-radius: 8px; background: #f8fafc; color: #718096; font-size: 10px; }
.resume-mastery { display: flex; align-items: center; gap: 6px; margin-top: 11px; }
.resume-mastery > span { margin-right: 3px; color: #94a3b8; font-size: 9px; }
.resume-mastery button { padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: #64748b; font: 700 9px inherit; cursor: pointer; }
.resume-mastery .hard.selected { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
.resume-mastery .fuzzy.selected { color: #d97706; border-color: #fde68a; background: #fffbeb; }
.resume-mastery .known.selected { color: #059669; border-color: #a7f3d0; background: #ecfdf5; }

.resume-check-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 24px; background: #fff; border: 1px solid var(--border); border-radius: 14px 14px 0 0; }
.resume-check-head p, .resume-library-head p { margin-top: 5px; color: #8794a8; font-size: 11px; }
.resume-check-head > strong { color: #263b80; font-size: 26px; }
.resume-check-progress { height: 6px; overflow: hidden; background: #e7ebf2; }
.resume-check-progress span { display: block; height: 100%; border-radius: 0 99px 99px 0; background: var(--primary); }
.resume-check-groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
.resume-check-groups article { padding: 17px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
.resume-check-groups h3 { display: flex; justify-content: space-between; margin-bottom: 10px; color: #25324a; font-size: 13px; }
.resume-check-groups h3 span { color: #94a3b8; font-size: 10px; }
.resume-check-item { display: flex; width: 100%; align-items: flex-start; gap: 9px; padding: 9px 5px; border: 0; border-top: 1px solid #f1f4f8; background: none; color: #5b687b; text-align: left; font: 11px/1.55 inherit; cursor: pointer; }
.resume-check-item i { display: grid; flex: 0 0 auto; width: 18px; height: 18px; place-items: center; margin-top: 1px; border: 1px solid #cad2df; border-radius: 5px; color: #fff; font-size: 10px; font-style: normal; }
.resume-check-item.checked { color: #94a3b8; text-decoration: line-through; }
.resume-check-item.checked i { border-color: #10b981; background: #10b981; }

.resume-library-head { padding: 24px; margin-bottom: 14px; background: #fff; border: 1px solid var(--border); border-radius: 14px; }
.resume-library-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.resume-library-card { padding: 20px; border: 1px solid var(--border); border-radius: 14px; background: #fff; color: inherit; text-decoration: none; transition: all var(--transition); }
.resume-library-card:hover { transform: translateY(-2px); border-color: #aebcf7; box-shadow: var(--shadow-hover); }
.resume-library-card > div { display: flex; align-items: center; justify-content: space-between; }
.resume-library-card > div span { font-size: 27px; }
.resume-library-card > div i { padding: 3px 8px; border-radius: 6px; background: #edf1ff; color: #5269ca; font: 800 9px inherit; }
.resume-library-card h3 { margin-top: 10px; color: #172554; font-size: 15px; }
.resume-library-card p { margin-top: 5px; color: #8794a8; font-size: 11px; line-height: 1.6; }
.resume-library-card ul { display: flex; gap: 5px; margin: 12px 0; list-style: none; flex-wrap: wrap; }
.resume-library-card li { padding: 3px 7px; border-radius: 6px; background: #f5f7fa; color: #718096; font-size: 9px; }
.resume-library-card > b { color: var(--primary); font-size: 10px; }
.resume-privacy-note { margin-top: 13px; padding: 10px 12px; border-radius: 9px; background: #fff8e8; color: #8b6a18; font-size: 10px; }
.resume-mode .category-wrap { display: none; }
.resume-mode .fab { display: none !important; }

/* ---- Modal ---- */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 500; backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity var(--transition);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
    background: #fff; border-radius: 14px; width: 520px; max-width: 92vw;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15);
    padding: 28px 30px 24px;
}
.modal h3 { font-size: 18px; color: #0f172a; font-weight: 700; margin-bottom: 4px; }
.modal .modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
.modal label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; margin-top: 12px; }
.modal textarea, .modal select, .modal input:not([type="file"]) {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; outline: none; transition: border-color var(--transition), box-shadow var(--transition);
    resize: vertical; background: #f8fafc;
}
.modal textarea:focus, .modal select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,108,247,.1); background: #fff; }
.modal textarea { min-height: 60px; }
.modal .answer-ta { min-height: 140px; }
.modal .auto-badge { display: inline-block; padding: 2px 10px; font-size: 11px; border-radius: 10px; background: #dcfce7; color: #16a34a; margin-left: 8px; font-weight: 500; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.modal .btn-primary {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    background: var(--primary); color: #fff; font-weight: 600; transition: all var(--transition);
}
.modal .btn-primary:hover { opacity: .92; transform: translateY(-1px); }
.modal .btn-cancel {
    padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; cursor: pointer; background: #fff; color: var(--text-muted); transition: all var(--transition); font-weight: 500;
}
.modal .btn-cancel:hover { border-color: #94a3b8; color: var(--text); }

/* ---- 杂项 ---- */
code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Monaco, "Courier New", monospace;
    background: #f1f5f9; color: var(--text); padding: 2px 6px; border-radius: 4px; font-size: .9em;
}
pre { background: #1e293b; color: #e2e8f0; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
pre code { background: transparent; color: inherit; padding: 0; }

.no-result { text-align: center; color: var(--text-muted); font-size: 13px; padding: 28px 14px; }

.back-top {
    position: fixed; bottom: 28px; right: 28px; width: 42px; height: 42px; border-radius: 50%;
    background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow);
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity var(--transition); pointer-events: none; z-index: 200;
}
.back-top.visible { opacity: 1; pointer-events: auto; }
.back-top:hover { background: var(--primary-light); border-color: var(--primary); }

.toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 10px; font-size: 13px;
    background: #1e293b; color: #fff; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,.15);
    opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---- 同步、备份与安装 ---- */
.sync-entry { flex-basis: 100% !important; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; display: inline-block; margin-right: 4px; }
.sync-dot.online { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.12); }
.sync-dot.busy { background: #f59e0b; animation: syncPulse 1s infinite alternate; }
.sync-dot.error { background: var(--danger); }
@keyframes syncPulse { to { opacity: .35; } }
.sync-modal { width: 480px; }
.sync-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.icon-close { width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: #64748b; font-size: 22px; line-height: 1; cursor: pointer; }
.sync-status-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; margin: 8px 0 16px; }
.sync-status-card .sync-status-icon { width: 38px; height: 38px; border-radius: 10px; background: #fff; display: grid; place-items: center; font-size: 20px; box-shadow: var(--shadow); }
.sync-status-card strong, .sync-status-card small { display: block; }
.sync-status-card strong { font-size: 14px; color: #0f172a; }
.sync-status-card small { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.config-hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.55; }
.config-hint.error { color: var(--danger); }
.signed-in-panel { padding: 2px 0 6px; }
.signed-in-panel p { font-size: 13px; color: #475569; }
.backup-section { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px; }
.backup-section h4 { font-size: 13px; color: #0f172a; }
.backup-section p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.backup-actions { margin-top: 12px !important; }
.backup-actions button { flex: 1; }
.more-panel, .more-panel-overlay { display: none; }

/* ============================================
   移动端 (≤ 768px)
   ============================================ */
@media (max-width: 768px) {
    body { flex-direction: column; padding-top: 52px; padding-bottom: 64px; background: #f1f5f9; }

    /* 侧边栏 → 抽屉 */
    .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: 280px; height: 100vh;
        z-index: 200; transform: translateX(-100%);
        transition: transform .3s cubic-bezier(.4,0,.2,1);
        box-shadow: none; border-right: 1px solid var(--border); overflow-y: auto;
    }
    .sidebar.drawer-open { transform: translateX(0); box-shadow: 4px 0 30px rgba(0,0,0,.15); }
    .sidebar.collapsed { width: 280px; }
    .sidebar.collapsed .header-text,
    .sidebar.collapsed .sub,
    .sidebar.collapsed .search-wrap,
    .sidebar.collapsed .category-wrap,
    .sidebar.collapsed .toc-wrap,
    .sidebar.collapsed .sidebar-footer { display: block !important; }
    .sidebar.collapsed .toc-item { padding: 10px 14px; text-align: left; }
    .sidebar.collapsed .toc-item .cat-dot { display: inline-block !important; }
    .sidebar.collapsed .sidebar-toggle { margin-left: 6px; }
    .sidebar-toggle { width: 36px; height: 36px; font-size: 16px; }
    .sidebar-header { padding: 14px 14px 10px; }
    .sidebar-header h2 { font-size: 15px; }
    .search-wrap { padding: 8px 14px; }
    .search-wrap input { padding: 10px 10px 10px 34px; font-size: 15px; }
    .category-wrap { padding: 6px 14px; }
    .cat-btn { padding: 5px 12px; font-size: 12px; }
    .sidebar-footer { padding: 8px 10px; }
    .sidebar-footer .quick-btn { padding: 8px 6px; font-size: 12px; }
    .toc-item { padding: 10px 14px; font-size: 13px; }
    .toc-wrap { max-height: none; }

    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 199; }
    .drawer-overlay.show { display: block; }

    /* 主内容 */
    .main { margin-left: 0 !important; padding: 14px 14px 20px; max-width: 100%; width: 100% !important; }
    .main-header { margin-bottom: 18px; }
    .main-header h1 { font-size: 20px; }
    .main-header .subtitle { font-size: 13px; }
    .main-header .stats { font-size: 12px; gap: 4px; }
    .toggle-all-btn { padding: 5px 12px; font-size: 11px; }

    /* 卡片 */
    .note { padding: 14px 14px; border-radius: 10px; margin-bottom: 8px; border: none; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .note.marked { border-left: 3px solid var(--mark-color); }
    .note .question { font-size: 14px; gap: 6px; padding-bottom: 8px; }
    .note .question::before { width: 20px; height: 20px; font-size: 11px; border-radius: 5px; }
    .note .answer { font-size: 13px; padding-left: 26px; line-height: 1.75; }
    .note .meta-row { padding-left: 26px; margin-top: 8px; }
    .note .category-tag { font-size: 10px; padding: 3px 8px; }
    .action-btn { width: 34px; height: 34px; font-size: 16px; }
    .cat-section-title { font-size: 12px; margin: 20px 0 8px; padding-bottom: 6px; }

    /* Quiz */
    .quiz-banner { padding: 14px 16px; flex-direction: column; align-items: flex-start; }
    .quiz-card { padding: 14px 16px; }
    .quiz-card .quiz-q { font-size: 14px; }
    .quiz-card .quiz-answer { font-size: 13px; padding: 10px 12px; }
    .quiz-card .reveal-btn { padding: 7px 18px; font-size: 13px; }

    /* 资源 */
    .resource-grid { grid-template-columns: 1fr; }

    /* 简历准备中心 */
    .resume-tabs { position: sticky; top: 58px; z-index: 40; margin: 0 -4px 14px; padding: 5px; border-radius: 12px; }
    .resume-tab { min-width: 92px; padding: 9px 10px; font-size: 11px; }
    .resume-hero { grid-template-columns: 1fr; gap: 22px; padding: 24px 20px; border-radius: 15px; }
    .resume-hero h2 { font-size: 23px; }
    .resume-hero-copy > p { font-size: 12px; }
    .resume-score { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 0 12px; text-align: left; }
    .resume-score strong { grid-row: 1 / 3; font-size: 38px; }
    .resume-score > span { margin: 0; }
    .resume-score > div { margin-top: 7px; }
    .resume-stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0 24px; }
    .resume-stat-grid article { padding: 12px; }
    .resume-section-heading { align-items: flex-start; margin-top: 22px; }
    .resume-section-heading h2, .resume-check-head h2, .resume-library-head h2, .resume-mock-banner h2 { font-size: 18px; }
    .resume-section-heading > small { display: none; }
    .resume-source-grid, .resume-route ol, .resume-check-groups, .resume-library-grid { grid-template-columns: 1fr; }
    .resume-source-role { min-height: 0; }
    .resume-route ol { gap: 7px; }
    .resume-filters { margin-bottom: 14px; }
    .resume-pitch-card, .resume-story-card { padding: 17px; }
    .resume-pitch-card p { font-size: 12px; }
    .resume-story-card > header { display: block; }
    .resume-story-card > header > div:last-child { justify-content: flex-start; margin-top: 9px; }
    .resume-story-card dl { grid-template-columns: 1fr; }
    .resume-story-card dl > div { padding: 10px; }
    .resume-mock-banner { align-items: flex-start; padding: 18px; }
    .resume-mock-banner p { max-width: 210px; }
    .resume-mock-banner > button { padding: 9px 11px; }
    .resume-question-tools { align-items: stretch; flex-direction: column; }
    .resume-question-tools label { max-width: none; }
    .resume-question-tools > span { display: none; }
    .resume-question { padding: 14px 13px; }
    .resume-question > span:nth-child(2) { font-size: 12px; }
    .resume-answer { padding: 0 13px 14px; }
    .resume-answer > p { font-size: 12px; }
    .resume-mastery { align-items: stretch; flex-wrap: wrap; }
    .resume-mastery > span { flex-basis: 100%; }
    .resume-mastery button { flex: 1; padding: 7px 8px; }

<script>
// ===================== 笔记数据 =====================
const NOTES = [
    // ===== Java 基础 =====
    { id: "java-equals", question: "说一下 Java 中 == 与 equals() 的区别？", answer: "== 比较基本数据类型时，比较的是两个数值是否相等；比较引用类型时，比较的是对象的内存地址是否相等。\n\nequals() 没有重写时，Object 默认以 == 来实现，即比较两个对象的内存地址是否相等；重写以后，按照对象的内容进行比较。", category: "Java基础", keywords: ["equals", "比较", "引用", "内存地址"] },
    { id: "java-hashcode", question: "为什么重写 equals() 必须重写 hashCode()？", answer: "1. 如果两个对象 equals 相等，那么它们的 hashCode 必须相等——这是 Java 规范强制要求的。\n2. 如果只重写 equals 而不重写 hashCode，两个相等的对象可能返回不同的 hashCode，导致它们在 HashSet、HashMap 等哈希结构中表现出异常行为（比如 put 进去却 get 不出来）。\n3. 哈希集合先用 hashCode 定位桶（bucket），再在桶内用 equals 比较。如果 hashCode 不一致，连桶都找不对。", category: "Java基础", keywords: ["hashCode", "equals", "HashSet", "HashMap", "哈希"] },
    { id: "java-string-pool", question: "String 为什么不可变？String 常量池是什么？", answer: "String 被 final 修饰，底层是 private final char[]（JDK9 后是 byte[]），没有提供修改数组内容的方法。\n\n不可变的好处：\n1. 线程安全，天然适合作为 Map 的 key\n2. 安全，防止引用被篡改\n3. 字符串常量池可以复用\n\n常量池：JVM 为字符串开辟的专用区域。用双引号创建的字符串字面量会被放入常量池，相同字面量不会重复创建，直接复用引用。new String(\"abc\") 则会创建两个对象（堆上一个 + 常量池一个）。", category: "Java基础", keywords: ["String", "不可变", "常量池", "final", "字符串"] },
    { id: "java-oop-features", question: "面向对象的三大特性是什么？", answer: "封装：隐藏内部实现细节，只暴露 public 方法，提高安全性和可维护性。\n\n继承：子类继承父类的属性和方法，实现代码复用。Java 单继承，多实现。\n\n多态：同一个方法调用，不同对象执行不同的行为。\n- 编译时多态（重载）：方法名相同，参数列表不同\n- 运行时多态（重写）：父类引用指向子类对象，调用重写方法时执行子类版本\n\n（有人会加第四个——抽象：提取共性形成抽象类或接口。）", category: "Java基础", keywords: ["OOP", "封装", "继承", "多态", "抽象"] },
    { id: "java-abstract-vs-interface", question: "抽象类和接口的区别？JDK8+ 有什么变化？", answer: "1. 抽象类可以有构造函数，接口没有\n2. 抽象类可以有普通成员变量，接口只有 public static final 常量\n3. 抽象类可以包含普通方法，接口中的方法默认为 public abstract（JDK8 后可以有 default 和 static 方法，JDK9 后可以有 private 方法）\n4. 类只能继承一个抽象类，但可以实现多个接口\n\n选择：需要代码复用 → 抽象类；定义行为规范 → 接口。", category: "Java基础", keywords: ["抽象类", "接口", "interface", "abstract", "default方法"] },
    { id: "java-exception", question: "Java 异常体系是怎样的？", answer: "Throwable\n├── Error（严重错误，不用处理，如 OOM、StackOverflow）\n└── Exception\n    ├── RuntimeException（运行时异常，unchecked，如 NPE、ArrayIndexOutOfBounds）\n    └── 其他（受检异常 checked，必须 try-catch 或 throws，如 IOException、SQLException）\n\n常见处理：catch 块中可以先处理具体的子异常，再处理父异常。finally 中的代码一定会执行（除非 System.exit）。try-with-resources 自动关闭实现了 AutoCloseable 的资源。", category: "Java基础", keywords: ["异常", "Exception", "Error", "RuntimeException", "checked", "unchecked"] },

    // ===== 集合 =====
    { id: "collections-framework", question: "Java 集合框架的体系结构？", answer: "Collection（接口）\n├── List：有序可重复 —— ArrayList（数组，查快）、LinkedList（链表，增删快）、Vector（线程安全，旧）\n├── Set：无序不可重复 —— HashSet（哈希）、LinkedHashSet（哈希+链表，有序）、TreeSet（红黑树，排序）\n└── Queue：队列 —— LinkedList、PriorityQueue、ArrayDeque\n\nMap（接口，独立体系）\n├── HashMap：数组+链表+红黑树，JDK8 后链表长度≥8转红黑树\n├── LinkedHashMap：HashMap + 双向链表，保持插入/访问顺序\n├── TreeMap：红黑树，Key 排序\n├── Hashtable：线程安全，旧，不推荐\n└── ConcurrentHashMap：分段锁/CAS，高并发首选", category: "集合", keywords: ["集合", "Collection", "List", "Set", "Map", "HashMap", "ArrayList"] },
    { id: "hashmap-principle", question: "HashMap 的底层原理（JDK8）？", answer: "底层结构：数组（Node[] table） + 链表 + 红黑树\n\nput 流程：\n1. 对 key 的 hashCode 做高16位异或低16位扰动，减少碰撞\n2. (n-1) & hash 计算下标\n3. 该位置为空 → 直接放入；不为空 → 用 equals 判断 key 是否相同\n4. 相同则覆盖，不同则以链表形式追加\n5. 链表长度 ≥8 且 table 长度 ≥64 时，链表转为红黑树\n6. size > threshold（capacity × loadFactor）时扩容为原来的 2 倍\n\nget 流程：hash → 找到桶 → 链表/红黑树中 equals 查找。\n\n默认容量 16，负载因子 0.75，扩容阈值 = 16 × 0.75 = 12。", category: "集合", keywords: ["HashMap", "红黑树", "哈希", "扩容", "负载因子"] },
    { id: "arraylist-vs-linkedlist", question: "ArrayList 和 LinkedList 的区别？", answer: "底层：ArrayList 是动态数组（Object[]），LinkedList 是双向链表。\n\n性能：\n- 随机访问 get/set：ArrayList O(1)，LinkedList O(n)\n- 头插 addFirst：ArrayList O(n) 需要搬移，LinkedList O(1)\n- 尾插 addLast：都是 O(1)（ArrayList 偶尔扩容需 O(n)）\n- 中间插入：ArrayList O(n) 搬移，LinkedList O(n) 找位置\n\n内存：ArrayList 尾部可能有空位（预留容量），LinkedList 每个节点要存前后指针，内存开销更大。\n\n选 ArrayList 为主——大部分场景是查多改少。需要频繁头插/删除时选 LinkedList。", category: "集合", keywords: ["ArrayList", "LinkedList", "数组", "链表", "性能"] },

    // ===== JVM =====
    { id: "jvm-memory-model", question: "JVM 运行时数据区（内存模型）是怎样的？", answer: "线程共享：\n1. 堆（Heap）：存放对象实例，GC 的主要区域。分为新生代（Eden + S0 + S1）和老年代\n2. 方法区 / 元空间（JDK8+ Metaspace）：类信息、常量、静态变量、JIT 编译缓存。JDK8 前叫永久代在堆中，JDK8 后移到本地内存\n\n线程私有：\n3. 虚拟机栈（VM Stack）：栈帧存局部变量表、操作数栈、方法出口等\n4. 本地方法栈：为 Native 方法服务\n5. 程序计数器（PC Register）：记录当前线程执行位置\n\n运行时常量池：Class 文件常量池的运行时表示，JDK7 后移到堆中。", category: "JVM", keywords: ["JVM", "内存模型", "堆", "栈", "方法区", "元空间", "Metaspace"] },
    { id: "jvm-gc-algorithm", question: "JVM 有哪些垃圾回收算法？常见垃圾收集器有哪些？", answer: "算法：\n1. 标记-清除（Mark-Sweep）：标记存活，清除未标记。缺点：碎片化。\n2. 标记-复制（Mark-Copying）：新生代常用，Eden→S0→S1 来回拷贝。浪费空间但无碎片。\n3. 标记-整理（Mark-Compact）：老年代用，标记后把存活对象移到一端，清理边界外。\n\n收集器（经典组合）：\n- Serial / Serial Old：单线程，适合客户端\n- ParNew / CMS：ParNew 新生代并行；CMS 老年代并发标记清除，低停顿（JDK9 废弃）\n- Parallel Scavenge / Parallel Old：吞吐量优先\n- G1：JDK9 默认，区域化，预测停顿时间\n- ZGC / Shenandoah：超低延迟，TB 级堆", category: "JVM", keywords: ["GC", "垃圾回收", "CMS", "G1", "ZGC", "标记清除", "标记整理"] },
    { id: "jvm-classload", question: "类加载机制是怎样的？双亲委派模型是什么？", answer: "类加载过程：加载 → 验证 → 准备 → 解析 → 初始化\n\n加载：通过全限定名获取二进制字节流，转为方法区的运行时数据结构，生成 Class 对象\n验证：文件格式、元数据、字节码、符号引用验证\n准备：为静态变量分配内存并赋零值（final static 直接赋实际值）\n解析：符号引用替换为直接引用\n初始化：执行 <clinit>，静态变量赋值 + 静态代码块\n\n双亲委派模型：\nBootstrap CL → Extension CL → Application CL → 自定义 CL\n一个类加载器收到加载请求时，先委派给父加载器，父加载不了才自己加载。\n好处：防止核心类被篡改（比如自定义 java.lang.String 不会加载），保证类的唯一性。\n\nTomcat 等会破坏双亲委派：用 WebAppClassLoader 先自己加载，实现应用隔离。", category: "JVM", keywords: ["类加载", "双亲委派", "ClassLoader", "初始化", "Tomcat"] },

    // ===== 多线程/并发 =====
    { id: "thread-lifecycle", question: "Java 线程的生命周期（状态）是怎样的？", answer: "NEW：线程创建但未启动（new Thread() 未调用 start()）\n\nRUNNABLE：调用 start() 后，线程就绪等待 CPU 调度（包含就绪 + 运行中）\n\nBLOCKED：等待获取 monitor 锁（synchronized），锁被其他线程持有\n\nWAITING：无限等待，直到被其他线程显式唤醒（Object.wait()、Thread.join()、LockSupport.park()）\n\nTIMED_WAITING：有限等待（sleep(time)、wait(timeout)、join(timeout)）\n\nTERMINATED：线程执行完毕\n\n状态流转：NEW → start() → RUNNABLE → 获取锁 → BLOCKED → 释放锁 → RUNNABLE → 结束 → TERMINATED\nwait() 让线程从 RUNNABLE → WAITING，notify() 让线程 → BLOCKED → 获取锁后 → RUNNABLE", category: "多线程/并发", keywords: ["线程", "生命周期", "状态", "Thread", "WAITING", "BLOCKED"] },
    { id: "synchronized-lock-upgrade", question: "synchronized 的锁升级过程？", answer: "synchronized 在 JDK6 后引入了偏向锁、轻量级锁、重量级锁的升级机制（不可降级）：\n\n1. 无锁 → 偏向锁：第一个线程获取锁时，在对象头 Mark Word 中记录线程 ID，下次该线程进入只需比对线程 ID，无需 CAS。\n\n2. 偏向锁 → 轻量级锁：有另一个线程竞争时，偏向锁撤销。线程在自己的栈帧中创建 Lock Record，通过 CAS 将 Mark Word 指向 Lock Record。自旋等待。\n\n3. 轻量级锁 → 重量级锁：自旋超过一定次数（默认10次，或自适应），升级为重量级锁。未获取锁的线程进入阻塞队列，由操作系统 Mutex Lock 实现，涉及用户态/内核态切换。\n\n锁信息存储在对象头的 Mark Word 中（64位 JVM 占 64 bits）。", category: "多线程/并发", keywords: ["synchronized", "锁升级", "偏向锁", "轻量级锁", "重量级锁", "Mark Word"] },
    { id: "aqs-principle", question: "AQS（AbstractQueuedSynchronizer）的原理？", answer: "AQS 是 JUC 包的基石，ReentrantLock、Semaphore、CountDownLatch 等都基于它实现。\n\n核心：\n- state（volatile int）：同步状态。lock 时 state=0→1，重入时 state++，unlock 时 state--，到 0 时释放。\n- CLH 队列（双向链表）：未获取到锁的线程包装成 Node 节点排队。\n- 自旋 + CAS + LockSupport.park/unpark：\n  获取锁失败 → CAS 入队 → 判断前驱是否为 head（再试一次）→ park 阻塞\n  释放锁 → unpark 后继节点 → 后继节点尝试获取锁\n\n独占模式（ReentrantLock）：只有一个线程能获取\n共享模式（Semaphore、CountDownLatch）：多个线程可以同时获取", category: "多线程/并发", keywords: ["AQS", "ReentrantLock", "CAS", "CLH", "state", "LockSupport"] },
    { id: "threadlocal-principle", question: "ThreadLocal 的实现原理？内存泄漏问题怎么解决？", answer: "每个 Thread 内部有一个 ThreadLocalMap，key 是 ThreadLocal 的弱引用，value 是存的值。\n\nget() → 获取当前线程 → 拿到 ThreadLocalMap → 用当前 ThreadLocal 作为 key 取值。\n\n内存泄漏原因：ThreadLocal 被 GC 回收后，key 变为 null，但 ThreadLocalMap 中的 value 仍然强引用存在，如果线程是线程池中的线程（长期存活），value 永远不会被回收。\n\n解决：每次使用完后调用 ThreadLocal.remove() 清理。ThreadLocal 的 get/set/remove 方法内部会顺便清理 key 为 null 的 entry。\n\n使用场景：数据库连接、Session 管理、事务上下文传递（保证同一线程内共享）。", category: "多线程/并发", keywords: ["ThreadLocal", "内存泄漏", "弱引用", "ThreadLocalMap", "线程池"] },

    // ===== Spring =====
    { id: "spring-ioc-aop", question: "Spring 的 IoC 和 AOP 是什么？", answer: "IoC（控制反转）：\n对象的创建、管理、依赖注入交由 Spring 容器管理，不再由程序员手动 new。核心是 DI（依赖注入）。\n实现：ApplicationContext/BeanFactory + 反射。\n注入方式：构造器注入（推荐）、Setter 注入、字段注入（@Autowired）。\n\nAOP（面向切面编程）：\n将横切关注点（日志、事务、权限）与核心业务逻辑分离。\n原理：动态代理。\n- 有接口 → JDK 动态代理（Proxy + InvocationHandler）\n- 无接口 → CGLIB 动态代理（生成目标类的子类）\nSpring Boot 2.x 默认使用 CGLIB。\n\n核心概念：Aspect（切面）、JoinPoint（连接点）、Advice（通知：before/after/around）、Pointcut（切入点）。\n\n常见应用：@Transactional、@Cacheable、统一日志、权限校验。", category: "Spring框架", keywords: ["Spring", "IoC", "AOP", "动态代理", "CGLIB", "依赖注入", "事务"] },
    { id: "spring-bean-lifecycle", question: "Spring Bean 的生命周期是怎样的？", answer: "1. 实例化：反射调用构造器创建 Bean 实例\n2. 属性赋值：DI 注入（@Autowired、@Value 等）\n3. 感知接口回调：BeanNameAware → BeanFactoryAware → ApplicationContextAware\n4. BeanPostProcessor.postProcessBeforeInitialization()\n5. 初始化：@PostConstruct → InitializingBean.afterPropertiesSet() → init-method\n6. BeanPostProcessor.postProcessAfterInitialization() → 这里也是 AOP 代理生成的时机\n7. Bean 就绪可用\n8. 销毁：@PreDestroy → DisposableBean.destroy() → destroy-method\n\n注意：AOP 代理对象是在 postProcessAfterInitialization 这一步创建的（AbstractAutoProxyCreator）。", category: "Spring框架", keywords: ["Spring", "Bean", "生命周期", "BeanPostProcessor", "Aware"] },
    { id: "spring-transactional", question: "@Transactional 的原理和失效场景？", answer: "原理：基于 AOP 动态代理。在方法执行前后通过 TransactionInterceptor 开启/提交/回滚事务。TransactionManager 调用 DataSource.getConnection()，将连接绑定到当前线程（ThreadLocal），保证同一事务内使用同一连接。\n\n失效场景（常见面试题）：\n1. 方法非 public：CGLIB/JDK 代理只能代理 public 方法\n2. 同类方法内部调用：this.methodB() 不经过代理对象，事务不生效。解决：@Autowired 自己注入自己，或抽到另一个 Service\n3. 异常被 catch 吞掉：Spring 默认只在 RuntimeException 和 Error 时回滚。需要指定 rollbackFor\n4. 数据库引擎不支持事务：如 MyISAM\n5. 多线程：事务绑定在当前线程的 ThreadLocal，子线程拿不到同一连接\n6. propagation 设置不当：如 REQUIRES_NEW 会在新事务中执行", category: "Spring框架", keywords: ["Transactional", "事务", "AOP", "代理", "失效", "传播行为"] },

    // ===== 数据库/MySQL =====
    { id: "mysql-index-structure", question: "MySQL InnoDB 的索引结构？为什么用 B+ 树？", answer: "InnoDB 使用 B+ 树作为索引结构。\n\nB+ 树特点：\n1. 所有数据存在叶子节点，非叶子节点只存 key 不存数据（索引更矮胖，IO 更少）\n2. 叶子节点之间通过双向链表连接，支持范围查询（这点 B 树做不到）\n3. 每个节点对应一个磁盘页（默认 16KB），一次 IO 读一页\n\nB+ 树 vs B 树 vs 哈希：\n- B 树所有节点都存数据，范围查询需要中序遍历，更复杂\n- 哈希索引查询 O(1) 但不支持范围查询和排序\n- B+ 树查询 O(logN)，支持范围、排序、模糊前缀匹配\n\n聚簇索引（主键索引）：叶子节点存整行数据。\n非聚簇索引（二级索引/辅助索引）：叶子节点存主键值，需要回表。\n覆盖索引：查询列都在索引中，不需要回表，Explain 中 Extra=Using index。", category: "数据库", keywords: ["MySQL", "InnoDB", "B+树", "索引", "聚簇索引", "回表", "覆盖索引"] },
    { id: "mysql-transaction-isolation", question: "MySQL 事务隔离级别？每个级别解决了什么问题？", answer: "1. 读未提交（Read Uncommitted）：一个事务可以读到另一个事务未提交的修改。\n问题：脏读、不可重复读、幻读都存在。很少使用。\n\n2. 读已提交（Read Committed，Oracle 默认）：只能读到已提交的数据。\n解决：脏读\n问题：不可重复读（同一事务两次读取结果不同）、幻读\n\n3. 可重复读（Repeatable Read，MySQL InnoDB 默认）：同一事务内多次读取结果一致。\n解决：脏读、不可重复读\nMVCC + Gap Lock 也解决了大部分幻读\n\n4. 串行化（Serializable）：事务串行执行。\n解决所有问题，但并发性能最差。\n\nMVCC（多版本并发控制）：通过 undo log 版本链 + ReadView 实现。ReadView 记录活跃事务列表，根据版本链中的 trx_id 和 ReadView 判断数据可见性。", category: "数据库", keywords: ["MySQL", "事务", "隔离级别", "MVCC", "脏读", "幻读", "ReadView"] },
    { id: "mysql-optimization", question: "SQL 优化有哪些常用手段？", answer: "1. 索引优化：\n- 最左前缀原则：联合索引 (a, b, c)，查询条件必须包含 a 才能命中\n- 避免索引失效：where 中对列做函数/计算/隐式类型转换、前置模糊 like '%xx'、or 连接非索引列\n- 覆盖索引：select 的列都在索引中\n- 选择合适的索引列：区分度高的列（性别这种区分度低的列不适合单独索引）\n\n2. SQL 层面：\n- SELECT 具体字段，不用 SELECT *\n- 大偏移分页用游标/延迟关联：where id > last_id limit N\n- Join 代替子查询，小表驱动大表\n- 在 MySQL 8.0.18+ 版本使用 EXPLAIN ANALYZE 查看实际执行计划\n\n3. 表结构：\n- 字段类型选最小够用的\n- 垂直分表（拆字段）、水平分表（拆行）\n\n4. 配置：调整 buffer pool、连接数等\n\n5. 慢查询日志定位问题 SQL。\n\n常用 EXPLAIN 字段看：type（执行级别，range/ref 好，ALL 差）、key（使用的索引）、rows（扫描行数）、Extra（Using filesort/Using temporary 差）。", category: "数据库", keywords: ["SQL", "优化", "索引", "EXPLAIN", "慢查询", "最左前缀", "分页"] },

    // ===== 中间件 =====
    { id: "redis-data-types", question: "Redis 有哪些数据结构？各自适用场景？", answer: "基础数据结构：\n1. String：缓存、分布式锁（SETNX）、计数器、Session\n2. List（双向链表）：消息队列（LPUSH/RPOP）、最新列表\n3. Set（哈希表）：去重、共同好友（交集）、抽奖（随机出队）\n4. ZSet（跳表+哈希）：排行榜、延迟队列（score=时间戳）\n5. Hash：对象存储（用户信息）\n\n高级数据结构：\n- Bitmap：布隆过滤器、签到统计\n- HyperLogLog：UV 统计（误差 0.81%）\n- Geo：地理位置（附近的人）\n- Stream：持久化消息队列（消费者组）\n\n底层实现：String 简单动态字符串 SDS；List 在元素少时用 ziplist→quicklist；Set/Hash/ZSet 在小数据量时用 ziplist/压缩列表。", category: "中间件", keywords: ["Redis", "数据结构", "String", "ZSet", "Stream", "分布式锁"] },
    { id: "redis-cache-problems", question: "缓存穿透、击穿、雪崩是什么？怎么解决？", answer: "缓存穿透：查询不存在的数据，缓存和 DB 都没有。大量请求直接打到 DB。\n解决：\n- 布隆过滤器：先判断 key 是否可能存在\n- 缓存空值：null 也缓存，设置短过期时间\n- 参数校验：不合理的请求直接拦截\n\n缓存击穿：热点 key 过期瞬间，大量请求打到 DB。\n解决：\n- 热点数据永不过期或加长过期时间\n- 互斥锁（SETNX）：第一个线程查 DB 并回设缓存，其他线程等待\n- 逻辑过期：过期时先返回旧值，异步更新\n\n缓存雪崩：大量 key 同时过期或 Redis 宕机。\n解决：\n- 过期时间加随机值，避免同时过期\n- 缓存高可用：主从 + 哨兵/集群\n- 限流/降级：DB 层加限流，响应降级\n- 多级缓存：本地缓存（Caffeine）+ 远程缓存（Redis）", category: "中间件", keywords: ["Redis", "缓存穿透", "缓存击穿", "缓存雪崩", "布隆过滤器", "热点key"] },

    // ===== 设计模式 =====
    { id: "design-pattern-singleton", question: "单例模式的实现方式？DCL 为什么需要 volatile？", answer: "几种实现：\n1. 饿汉式：类加载时就创建。简单安全，但可能浪费内存。\n2. 懒汉式：需要时才创建。要加锁保证线程安全。\n3. DCL（双重检查锁）：先判空再抢锁，再判空再创建。需要 volatile。\n4. 静态内部类：利用类加载机制保证单例 + 延迟加载（推荐）。\n5. 枚举：最简单安全，防反射和序列化破坏。\n\nDCL 为什么需要 volatile：\ninstance = new Singleton() 不是原子操作，分三步：\n① 分配内存空间\n② 初始化对象\n③ 将引用指向内存地址\n\n指令重排可能导致②③顺序颠倒。线程 A 执行了①③（还未初始化），线程 B 看到 instance != null 直接返回了一个未初始化完成的对象。volatile 禁止指令重排，保证写操作 Happens-Before 读操作。", category: "设计模式", keywords: ["单例", "DCL", "volatile", "指令重排", "设计模式"] },

function deleteNote(id) {
    if (deletedIds.has(id)) return;
    deletedIds.add(id);
    markedIds.delete(id); // 标记也一起清除
    sunkIds.delete(id);   // 置底也清除
    delete mastery[id];
    saveDeleted();
    saveMarked();
    saveSunk();
    saveMastery();
    const note = [...NOTES, ...userNotes].find(n => n.id === id);
    toast(`已移至回收站：${note ? note.question.slice(0, 20) + '...' : id}`);
    renderAll();
}

function restoreNote(id) {
    deletedIds.delete(id);
    saveDeleted();
    const note = [...NOTES, ...userNotes].find(n => n.id === id);
    toast(`已恢复：${note ? note.question.slice(0, 20) + '...' : id}`);
    renderAll();
}

function permDelete(id) {
    if (!confirm("确定永久删除这条笔记？此操作不可恢复。")) return;
    deletedIds.delete(id);
    markedIds.delete(id);
    sunkIds.delete(id);
    delete mastery[id];
    const userIndex = userNotes.findIndex(n => n.id === id);
    if (userIndex >= 0) {
        userNotes.splice(userIndex, 1);
        saveUserNotes();
    }
    if (NOTES.some(n => n.id === id)) {
        purgedIds.add(id);
        savePurged();
    }
    saveDeleted();
    saveMarked();
    saveSunk();
    saveMastery();
    toast("已永久删除");
    renderAll();
}

function emptyTrash() {
    if (deletedIds.size === 0) return;
    if (!confirm(`确定清空回收站？将永久删除 ${deletedIds.size} 条笔记，此操作不可恢复。`)) return;
    [...deletedIds].forEach(id => {
        const userIndex = userNotes.findIndex(n => n.id === id);
        if (userIndex >= 0) userNotes.splice(userIndex, 1);
        if (NOTES.some(n => n.id === id)) purgedIds.add(id);
        markedIds.delete(id);
        sunkIds.delete(id);
        delete mastery[id];
    });
    deletedIds.clear();
    saveUserNotes();
    savePurged();
    saveDeleted();
    saveMarked();
    saveSunk();
    saveMastery();
    showTrash = false;
    toast("回收站已清空");
    renderAll();
}

function autoDetectCategory(question, answer) {
    const text = (question + " " + answer).toLowerCase();
    let best = null, bestScore = 0;
    for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
        let score = 0;
        keywords.forEach(kw => { if (text.includes(kw.toLowerCase())) score++; });
        if (score > bestScore) { bestScore = score; best = cat; }
    }
    return bestScore > 0 ? best : null;
}

// ===================== 随机抽查 =====================
function startQuiz() {
    const pool = getActiveNotes();
    if (pool.length < 3) { toast("题库至少需要 3 条笔记才能抽题"); return; }
    // Fisher-Yates 洗牌后取前 3 条
    const arr = [...pool];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    quizNotes = arr.slice(0, 3);
    quizRevealed = new Set();
    showQuiz = true;
    showTrash = false;
    showMarkedOnly = false;
    showResources = false;
    showInterviewExp = false;
    showResumePrep = false;
    showRecruitment = false;
    activeCategory = "all";
    activeNoteId = null;
    document.querySelectorAll("#categoryBtns .cat-btn").forEach(b => b.classList.remove("active"));
    const allBtn = document.querySelector("#categoryBtns .cat-btn[data-cat='all']");
    if (allBtn) allBtn.classList.add("active");
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ===================== 过滤 =====================
function getActiveNotes() {
    // 返回未被删除的笔记（用户添加的排最前面）
    const builtin = NOTES.filter(n => !deletedIds.has(n.id) && !purgedIds.has(n.id));
    const user = userNotes.filter(n => !deletedIds.has(n.id));
    return [...user, ...builtin];
}
function getDeletedNotes() {
    const all = [...NOTES, ...userNotes];
    return all.filter(n => deletedIds.has(n.id) && !purgedIds.has(n.id));
}
function getFilteredNotes() {
    if (showQuiz) return quizNotes;
    const pool = showTrash ? getDeletedNotes() : getActiveNotes();
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const filtered = pool.filter(n => {
        if (showMarkedOnly && !markedIds.has(n.id)) return false;
        if (!showMarkedOnly && !showTrash && activeCategory !== "all" && n.category !== activeCategory) return false;
        if (!keyword) return true;
        const haystack = (n.question + " " + n.answer + " " + n.category + " " + (n.keywords || []).join(" ")).toLowerCase();
        return haystack.includes(keyword);
    });
    // 置底的笔记排到最后
    if (!showTrash) {
        filtered.sort((a, b) => (sunkIds.has(a.id) ? 1 : 0) - (sunkIds.has(b.id) ? 1 : 0));
    }
    return filtered;
}

        return;
    }
    if (showRecruitment) {
        list.innerHTML = renderRecruitmentTOC();
        noResult.style.display = "none";
        return;
    }
    if (filtered.length === 0) { list.innerHTML = ""; noResult.style.display = "block"; return; }
    noResult.style.display = "none";
    list.innerHTML = filtered.map(n => {
        const color = CATEGORY_COLORS[n.category] || "#999";
        const activeClass = activeNoteId === n.id ? " active" : "";
        const star = markedIds.has(n.id) ? " <span class='marked-star'>★</span>" : "";
        return `<li><button class="toc-item${activeClass}" data-id="${n.id}" title="${n.category}"><span class="cat-dot" style="background:${color}"></span><span class="q-text">${escapeHTML(n.question)}${star}</span></button></li>`;
    }).join("");
}

    let trashBar = "";
    if (showTrash && filtered.length > 0) {
        trashBar = `<div class="trash-header">

            <button class="empty-trash-btn" onclick="emptyTrash()">永久清空回收站</button>

    }

    if (filtered.length === 0) {
        let msg = "没有匹配的笔记，试试其他关键词或分类";

        if (showMarkedOnly) msg = "还没有标记任何笔记，点击笔记右上角的 ⭐ 来标记";
        container.innerHTML = trashBar + `<p class="no-result" style="padding:50px 0;">${msg}</p>`;
        return;
    }

    // 按分类分组（回收站和已标记视图不分组）
    let html = trashBar;
    if (showTrash || showMarkedOnly) {
        filtered.forEach(n => html += buildNoteCard(n));
    } else {
        // 分离普通笔记和置底笔记
        const normal = filtered.filter(n => !sunkIds.has(n.id));
        const sunk = filtered.filter(n => sunkIds.has(n.id));
        const grouped = {};
        normal.forEach(n => { if (!grouped[n.category]) grouped[n.category] = []; grouped[n.category].push(n); });
        for (const [cat, notes] of Object.entries(grouped)) {
            html += `<div class="cat-section-title">${cat}</div>`;
            notes.forEach(n => html += buildNoteCard(n));
        }
        // 置底笔记统一放在最底下
        if (sunk.length > 0) {
            html += `<div class="cat-section-title" style="color:#a0aec0;border-bottom-color:#e2e8f0;">📌 已置底</div>`;
            sunk.forEach(n => html += buildNoteCard(n));
        }
    }
    container.innerHTML = html;
}

function buildNoteCard(n) {
    const isCollapsed = collapsedNotes.has(n.id);
    const isMarked = markedIds.has(n.id);
    const isSunk = sunkIds.has(n.id);
    const highlightClass = activeNoteId === n.id ? " highlight" : "";
    const markedClass = isMarked ? " marked" : "";
    const sunkClass = isSunk ? " sunk" : "";
    const inTrash = showTrash;

    const actions = inTrash
        ? `<div class="trash-actions">
            <button class="restore-btn" data-action="restore" data-id="${n.id}">↩ 恢复</button>
            <button class="perm-delete-btn" data-action="perm-delete" data-id="${n.id}">永久删除</button>
        </div>`
        : `<div class="note-actions">
            <button class="action-btn mark-btn${isMarked ? ' marked' : ''}" data-action="mark" data-id="${n.id}" title="${isMarked ? '取消标记' : '标记为重点'}">${isMarked ? '★' : '☆'}</button>
            <button class="action-btn sink-btn${sunkIds.has(n.id) ? ' sunk' : ''}" data-action="sink" data-id="${n.id}" title="${sunkIds.has(n.id) ? '取消置底' : '置底'}">${sunkIds.has(n.id) ? '🔽' : '⬇'}</button>
            <button class="action-btn delete-btn" data-action="delete" data-id="${n.id}" title="删除">🗑</button>
        </div>`;

    return `
    <article class="note${highlightClass}${markedClass}${sunkClass}" id="note-${n.id}">
        <div class="question" data-id="${n.id}">
            ${escapeHTML(n.question)}
            <span class="expand-icon${isCollapsed ? '' : ' open'}">▶</span>
        </div>
        <div class="answer${isCollapsed ? ' collapsed' : ''}">${escapeHTML(n.answer)}</div>
        <div class="meta-row">
            <span class="category-tag">${n.category}</span>
            ${actions}
        </div>
    </article>`;
}
