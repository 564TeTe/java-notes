// ===================== 云同步与本地备份 =====================
const SYNC_SESSION_KEY = "java-notes-sync-session";
const LOCAL_UPDATED_KEY = "java-notes-local-updated-at";
let syncSession = null;
let syncTimer = null;
let syncApplyingRemote = false;
let deferredInstallPrompt = null;

function getSyncConfig() {
    const config = window.SYNC_CONFIG || {};
    return {
        url: String(config.supabaseUrl || "").replace(/\/$/, ""),
        key: String(config.supabasePublishableKey || "")
    };
}

function isSyncConfigured() {
    const config = getSyncConfig();
    return /^https:\/\/.+\.supabase\.co$/i.test(config.url) && config.key.length > 20;
}

function loadSyncSession() {
    try { syncSession = JSON.parse(localStorage.getItem(SYNC_SESSION_KEY) || "null"); }
    catch (e) { syncSession = null; }
}

function storeSyncSession(session) {
    syncSession = session;
    if (session) localStorage.setItem(SYNC_SESSION_KEY, JSON.stringify(session));
    else localStorage.removeItem(SYNC_SESSION_KEY);
    updateSyncUI();
}

function getStateSnapshot() {
    return {
        version: 4,
        userNotes,
        markedIds: [...markedIds],
        deletedIds: [...deletedIds],
        sunkIds: [...sunkIds],
        purgedIds: [...purgedIds],
        mastery,
        resumePrep: getResumePrepSnapshot(),
        recruitment: getRecruitmentSnapshot(),
        interviews: getInterviewSnapshot(),
        customBankQuestions: getCustomBankQuestions(),
        updatedAt: localStorage.getItem(LOCAL_UPDATED_KEY) || new Date().toISOString()
    };
}

function applyStateSnapshot(data) {
    if (!data || typeof data !== "object") throw new Error("备份数据格式无效");
    // Validate new fields before touching existing local state; missing fields in v3 keep local records.
    const validatedInterviews = StudyCore.restoreInterviews(data.interviews, getInterviewSnapshot());
    const validatedCustomBankQuestions = StudyCore.restoreBankQuestions(data.customBankQuestions, getCustomBankQuestions());
    syncApplyingRemote = true;
    userNotes = Array.isArray(data.userNotes) ? data.userNotes : [];
    markedIds = new Set(Array.isArray(data.markedIds) ? data.markedIds : []);
    deletedIds = new Set(Array.isArray(data.deletedIds) ? data.deletedIds : []);
    sunkIds = new Set(Array.isArray(data.sunkIds) ? data.sunkIds : []);
    purgedIds = new Set(Array.isArray(data.purgedIds) ? data.purgedIds : []);
    mastery = data.mastery && typeof data.mastery === "object" ? data.mastery : {};
    applyResumePrepSnapshot(data.resumePrep);
    applyRecruitmentSnapshot(data.recruitment);
    applyInterviewSnapshot(validatedInterviews);
    applyCustomBankQuestionsSnapshot(validatedCustomBankQuestions);
    localStorage.setItem("user-notes", JSON.stringify(userNotes));
    localStorage.setItem("marked-ids", JSON.stringify([...markedIds]));
    localStorage.setItem("deleted-ids", JSON.stringify([...deletedIds]));
    localStorage.setItem("sunk-ids", JSON.stringify([...sunkIds]));
    localStorage.setItem("purged-ids", JSON.stringify([...purgedIds]));
    localStorage.setItem("mastery", JSON.stringify(mastery));
    localStorage.setItem(LOCAL_UPDATED_KEY, data.updatedAt || new Date().toISOString());
    syncApplyingRemote = false;
    buildCategoryBtns();
    renderAll();
}

function scheduleCloudSync() {
    if (syncApplyingRemote) return;
    localStorage.setItem(LOCAL_UPDATED_KEY, new Date().toISOString());
    if (!syncSession || !isSyncConfigured()) return;
    clearTimeout(syncTimer);
    setSyncStatus("busy", "等待同步");
    syncTimer = setTimeout(() => pushCloudState().catch(handleSyncError), 700);
}

async function supabaseRequest(path, options = {}) {
    const config = getSyncConfig();
    if (!isSyncConfigured()) throw new Error("尚未配置 Supabase");
    const headers = { "apikey": config.key, "Content-Type": "application/json", ...(options.headers || {}) };
    if (options.auth !== false && syncSession?.access_token) headers.Authorization = `Bearer ${syncSession.access_token}`;
    const response = await fetch(config.url + path, {
        method: options.method || "GET",
        headers,
        body: options.body === undefined ? undefined : JSON.stringify(options.body)
    });
    const raw = await response.text();
    let result = null;
    if (raw) {
        try { result = JSON.parse(raw); }
        catch (e) { result = raw; }
    }
    if (!response.ok) throw new Error(result?.msg || result?.message || result?.error_description || `请求失败（${response.status}）`);
    return result;
}

async function ensureFreshSession() {
    if (!syncSession?.refresh_token) return false;
    if (syncSession.expires_at && syncSession.expires_at * 1000 > Date.now() + 60000) return true;
    const refreshed = await supabaseRequest("/auth/v1/token?grant_type=refresh_token", {
        method: "POST", auth: false, body: { refresh_token: syncSession.refresh_token }
    });
    storeSyncSession(refreshed);
    return true;
}

async function signIn() {
    const email = document.getElementById("syncEmail").value.trim();
    const password = document.getElementById("syncPassword").value;
    if (!email || !password) { toast("请输入邮箱和密码"); return; }
    setSyncStatus("busy", "正在登录…");
    try {
        const session = await supabaseRequest("/auth/v1/token?grant_type=password", { method: "POST", auth: false, body: { email, password } });
        storeSyncSession(session);
        await syncNow();
        toast("登录成功，数据已同步");
    } catch (error) { handleSyncError(error); }
}

async function signUp() {
    const email = document.getElementById("syncEmail").value.trim();
    const password = document.getElementById("syncPassword").value;
    if (!email || password.length < 6) { toast("请输入邮箱和至少 6 位密码"); return; }
    setSyncStatus("busy", "正在注册…");
    try {
        const result = await supabaseRequest("/auth/v1/signup", { method: "POST", auth: false, body: { email, password } });
        if (result.access_token) {
            storeSyncSession(result);
            await pushCloudState();
            toast("注册成功，已开启同步");
        } else {
            setSyncStatus("local", "请查收验证邮件");
            toast("注册成功，请先验证邮箱再登录");
        }
    } catch (error) { handleSyncError(error); }
}

async function pushCloudState() {
    if (!syncSession || !isSyncConfigured()) return;
    await ensureFreshSession();
    setSyncStatus("busy", "正在上传…");
    const now = new Date().toISOString();
    localStorage.setItem(LOCAL_UPDATED_KEY, now);
    const data = getStateSnapshot();
    data.updatedAt = now;
    await supabaseRequest("/rest/v1/app_state?on_conflict=user_id", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: { user_id: syncSession.user.id, data, updated_at: now }
    });
    setSyncStatus("online", "刚刚已同步");
}

async function syncNow() {
    if (!syncSession) { openSyncModal(); return; }
    try {
        await ensureFreshSession();
        setSyncStatus("busy", "正在同步…");
        const rows = await supabaseRequest(`/rest/v1/app_state?select=data,updated_at&user_id=eq.${encodeURIComponent(syncSession.user.id)}&limit=1`);
        if (!rows?.length) {
            await pushCloudState();
            return;
        }
        const remote = rows[0];
        const localTime = Date.parse(localStorage.getItem(LOCAL_UPDATED_KEY) || 0);
        const remoteTime = Date.parse(remote.updated_at || 0);
        if (localTime > remoteTime + 1000) await pushCloudState();
        else {
            applyStateSnapshot(remote.data);
            setSyncStatus("online", "已获取最新数据");
        }
    } catch (error) { handleSyncError(error); }
}

function handleSyncError(error) {
    console.error("同步失败", error);
    setSyncStatus("error", "同步失败，数据已保存在本机");
    toast(error.message || "同步失败，请稍后重试");
}

function setSyncStatus(mode, text) {
    const dot = document.getElementById("syncDot");
    if (dot) dot.className = `sync-dot ${mode === "local" ? "" : mode}`;
    const label = document.getElementById("syncLabel");
    if (label) label.textContent = syncSession ? (mode === "busy" ? "同步中" : "云端同步") : "本地模式";
    const statusText = document.getElementById("syncStatusText");
    if (statusText && text) statusText.textContent = text;
}

function updateSyncUI() {
    const configured = isSyncConfigured();
    const signedIn = !!syncSession?.access_token;
    const authForm = document.getElementById("authForm");
    const signedInPanel = document.getElementById("signedInPanel");
    if (!authForm || !signedInPanel) return;
    authForm.hidden = signedIn;
    signedInPanel.hidden = !signedIn;
    document.getElementById("signedInEmail").textContent = syncSession?.user?.email || "当前账号";
    document.getElementById("syncStatusTitle").textContent = signedIn ? "云端同步已开启" : "本地模式";
    document.getElementById("syncStatusText").textContent = signedIn ? "电脑和手机登录同一账号即可同步" : "可离线使用，建议定期导出备份";
    document.querySelector(".sync-status-icon").innerHTML = typeof workspaceIcon === "function" ? workspaceIcon("sync") : "";
    const hint = document.getElementById("syncConfigHint");
    hint.textContent = configured ? "使用同一邮箱账号登录电脑和手机。" : "云同步尚未配置；请先按 DEPLOY.md 填写 sync-config.js。";
    hint.classList.toggle("error", !configured);
    document.getElementById("loginBtn").disabled = !configured;
    document.getElementById("registerBtn").disabled = !configured;
    setSyncStatus(signedIn ? "online" : "local", signedIn ? "电脑和手机登录同一账号即可同步" : "可离线使用，建议定期导出备份");
}

function openSyncModal() {
    closeMorePanel();
    updateSyncUI();
    document.getElementById("syncModal").classList.add("open");
}
function closeSyncModal() { document.getElementById("syncModal").classList.remove("open"); }

function signOut() {
    storeSyncSession(null);
    toast("已退出云同步，本地数据仍然保留");
}

function exportBackup() {
    const payload = { app: "java-notes", exportedAt: new Date().toISOString(), data: getStateSnapshot() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `java-notes-backup-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
    toast("备份已导出");
}

async function importBackup(file) {
    try {
        const payload = JSON.parse(await file.text());
        const data = payload.data || payload;
        applyStateSnapshot({ ...data, updatedAt: new Date().toISOString() });
        scheduleCloudSync();
        toast("备份已导入");
    } catch (error) { toast("导入失败：不是有效的备份文件"); }
}

function registerPWA() {
    AppUpdates.start();
    window.addEventListener("beforeinstallprompt", event => {
        event.preventDefault();
        deferredInstallPrompt = event;
        const btn = document.getElementById("installAppBtn");
        if (btn) btn.disabled = false;
    });
    window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        toast("应用已安装到桌面");
    });
}

async function installApp() {
    if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
    } else {
        toast("请使用浏览器菜单中的“添加到主屏幕”");
    }
}

// ===================== 移动端逻辑 =====================
function initMobile() {
    // Bind once at startup so navigation also works after resizing to mobile.

    const overlay = document.getElementById("drawerOverlay");
    const sidebar = document.querySelector(".sidebar");

    // 汉堡菜单 → 打开抽屉
    document.getElementById("hamburgerBtn").addEventListener("click", () => {
        sidebar.classList.add("drawer-open");
        overlay.classList.add("show");
    });
    function closeDrawer() {
        sidebar.classList.remove("drawer-open");
        overlay.classList.remove("show");
    }
    overlay.addEventListener("click", closeDrawer);

    // 搜索按钮 → 切换搜索条
    document.getElementById("mobileSearchBtn").addEventListener("click", () => {
        const bar = document.getElementById("mobileSearchBar");
        bar.classList.toggle("open");
        if (bar.classList.contains("open")) {
            document.getElementById("mobileSearchInput").focus();
        }
    });
    document.getElementById("mobileSyncBtn").addEventListener("click", openSyncModal);
    // 移动端搜索同步到桌面搜索
    document.getElementById("mobileSearchInput").addEventListener("input", function() {
        document.getElementById("searchInput").value = this.value;
        showQuiz = false; showResources = false; showInterviewExp = false; showResumePrep = false; showRecruitment = false; activeNoteId = null;
        renderAll();
        closeDrawer();
    });

    // 底部导航
    document.querySelector(".mobile-bottombar").addEventListener("click", e => {
        const tab = e.target.closest("[data-tab]");
        if (!tab) return;
        const tabName = tab.dataset.tab;
        closeDrawer();

        if (tabName === "all") {
            showMarkedOnly = false; showTrash = false; showQuiz = false; showResources = false; showInterviewExp = false; showResumePrep = false; showRecruitment = false;
            activeCategory = "all";
            document.querySelectorAll("#categoryBtns .cat-btn").forEach(b => b.classList.remove("active"));
            const allBtn = document.querySelector("#categoryBtns .cat-btn[data-cat='all']");
            if (allBtn) allBtn.classList.add("active");
        } else if (tabName === "resume") {
            showResumePrep = true; showRecruitment = false; showMarkedOnly = false; showTrash = false; showQuiz = false; showResources = false; showInterviewExp = false;
            activeCategory = "all";
        } else if (tabName === "recruitment") {
            showRecruitment = true; showResumePrep = false; showMarkedOnly = false; showTrash = false; showQuiz = false; showResources = false; showInterviewExp = false;
            activeCategory = "all";
        } else if (tabName === "quiz") {
            startQuiz();
            return;
        } else if (tabName === "more") {
            openMorePanel();
            updateMobileNavActive();
            return;
        }
        activeNoteId = null;
        updateMobileNavActive();
        renderAll();
    });

    // FAB → 添加笔记
    document.getElementById("fabAddBtn").addEventListener("click", openAddModal);

    // 分类面板：持久事件委托
    document.getElementById("catGrid").addEventListener("click", e => {
        const chip = e.target.closest(".cat-chip");
        if (!chip) return;
        selectCategory(chip.dataset.cat);
    });
    document.getElementById("catPanelOverlay").addEventListener("click", closeCategoryPanel);
    document.getElementById("morePanelOverlay").addEventListener("click", closeMorePanel);
    document.getElementById("morePanel").addEventListener("click", e => {
        const button = e.target.closest("[data-more-action]");
        if (!button) return;
        handleMoreAction(button.dataset.moreAction);
    });

    // 点击目录项 → 关闭抽屉
    document.getElementById("tocList").addEventListener("click", () => {
        if (window.matchMedia("(max-width: 768px)").matches) closeDrawer();
    });
}

function openMorePanel() {
    const panel = document.getElementById("morePanel");
    const overlay = document.getElementById("morePanelOverlay");
    if (!panel || !overlay) return;
    panel.classList.add("open");
    overlay.classList.add("show");
}

function closeMorePanel() {
    document.getElementById("morePanel")?.classList.remove("open");
    document.getElementById("morePanelOverlay")?.classList.remove("show");
}

function handleMoreAction(action) {
    closeMorePanel();
    if (action === "category") { openCategoryPanel(); return; }
    if (action === "sync") { openSyncModal(); return; }
    if (action === "install") { installApp(); return; }
    showTrash = action === "trash";
    showResources = action === "resources";
    showInterviewExp = action === "interviewExp";
    showMarkedOnly = action === "marked";
    showResumePrep = false;
    showRecruitment = false;
    showQuiz = false;
    activeCategory = "all";
    activeNoteId = null;
    renderAll();
    updateMobileNavActive();
}

function openCategoryPanel() {
    const panel = document.getElementById("categoryPanel");
    const overlay = document.getElementById("catPanelOverlay");
    const grid = document.getElementById("catGrid");
    const cats = studyCategories();
    const currentCat = (!showMarkedOnly && !showTrash && !showQuiz && !showResources && !showInterviewExp && !showResumePrep && !showRecruitment) ? activeCategory : null;
    grid.innerHTML = cats.map(cat =>
        `<button class="cat-chip${currentCat === cat ? ' active' : ''}" data-cat="${cat}">${cat}</button>`
    ).join("");
    panel.classList.add("open");
    overlay.classList.add("show");
}
function selectCategory(cat) {
    studyPage = 1;
    activeCategory = cat;
    showMarkedOnly = false; showTrash = false; showQuiz = false; showResources = false; showInterviewExp = false; showResumePrep = false; showRecruitment = false;
    activeNoteId = null;
    document.querySelectorAll("#categoryBtns .cat-btn").forEach(b => b.classList.remove("active"));
    const desktopBtn = document.querySelector(`#categoryBtns .cat-btn[data-cat="${cat}"]`);
    if (desktopBtn) desktopBtn.classList.add("active");
    renderAll();
    updateMobileNavActive();
    closeCategoryPanel();
}
function closeCategoryPanel() {
    document.getElementById("categoryPanel").classList.remove("open");
    document.getElementById("catPanelOverlay").classList.remove("show");
}

function updateMobileNavActive() {
    document.querySelectorAll(".mobile-bottombar .nav-item").forEach(b => b.classList.remove("active"));
    const tabName = showRecruitment ? "recruitment" : showResumePrep ? "resume" : (showTrash || showResources || showInterviewExp || showMarkedOnly) ? "more" : showQuiz ? "quiz" : "all";
    document.querySelector(`.mobile-bottombar [data-tab="${tabName}"]`)?.classList.add("active");
}

function updateMobileBadges() {
    document.getElementById("mobileMarkedBadge").style.display = markedIds.size > 0 ? "flex" : "none";
    document.getElementById("mobileMarkedBadge").textContent = markedIds.size;
    document.getElementById("mobileMoreBadge").style.display = deletedIds.size > 0 ? "flex" : "none";
    document.getElementById("mobileMoreBadge").textContent = deletedIds.size;
    // 更新顶栏标题
    const title = document.getElementById("mainTitle").textContent;
    document.getElementById("topbarTitle").textContent = title;
}

// 在原有 updateBadges 之后也刷新移动端徽章
const origUpdateBadges = updateBadges;
updateBadges = function() { origUpdateBadges(); updateMobileBadges(); };

// ===================== 启动 =====================
function init() {
    loadState();
    loadUserNotes();
    loadSyncSession();
    if (!localStorage.getItem(LOCAL_UPDATED_KEY) && (userNotes.length || markedIds.size || deletedIds.size || sunkIds.size)) {
        localStorage.setItem(LOCAL_UPDATED_KEY, new Date().toISOString());
    }
    if (window.matchMedia("(max-width: 768px)").matches) getActiveNotes().forEach(n => collapsedNotes.add(n.id));
    applySidebarState();
    buildCategoryBtns();
    renderAll();
    bindEvents();
    initMobile();
    updateSyncUI();
    registerPWA();
    if (syncSession && isSyncConfigured()) syncNow();
}
